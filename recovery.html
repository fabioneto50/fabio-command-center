<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fábio Command Center · Recuperação</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06111e;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.box{width:min(520px,100%);background:#0b1b2a;border:1px solid #29455d;border-radius:20px;padding:22px;box-shadow:0 24px 70px #0008}h1{font-size:22px;margin:0 0 8px}p{color:#a9bfd1;line-height:1.5}.status{margin:16px 0;padding:12px;border-radius:12px;background:#07131f;border:1px solid #20394f;font-size:14px}.ok{color:#8ee0b3}.err{color:#ff9f9f}button{width:100%;border:0;border-radius:12px;padding:13px 16px;background:#4ec8ff;color:#03101a;font-weight:800;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main class="box">
<h1>Recuperação do Command Center</h1>
<p>Esta página remove apenas o Service Worker e as caches FCC deste site. Os dados pessoais guardados em <strong>localStorage</strong> não são apagados.</p>
<div class="status" id="status">A preparar recuperação…</div>
<button id="run" type="button">Executar recuperação</button>
</main>
<script>
const status=document.getElementById('status');
const set=(text,cls='')=>{status.className='status '+cls;status.textContent=text};
async function recover(){
  document.getElementById('run').disabled=true;
  set('A remover Service Workers e caches antigas…');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('fcc-')).map(k=>caches.delete(k)));
    }
    try{sessionStorage.clear()}catch(e){}
    set('Recuperação concluída. A reabrir o site limpo…','ok');
    const target=new URL('./',location.href);target.searchParams.set('recovered',Date.now());
    setTimeout(()=>location.replace(target.href),600);
  }catch(e){
    console.error(e);set('Não foi possível concluir automaticamente. Fecha esta página e tenta novamente no Safari.','err');
    document.getElementById('run').disabled=false;
  }
}
document.getElementById('run').addEventListener('click',recover);
setTimeout(recover,150);
</script>
</body>
</html>
