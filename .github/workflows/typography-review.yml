name: Typography review
on:
  push:
    branches: [fix-typography-2026-09-18]
    paths: [scripts/normalize-typography.py, tests/audit-typography.py, .github/workflows/typography-review.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: typography-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Build source and preserve all clinical data
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix-typography-2026-09-18'
          mkdir -p audit-evidence
          if [ -f scripts/normalize-typography.py ]; then python scripts/normalize-typography.py; fi
          node --expose-internals scripts/build-assets.cjs | tee audit-evidence/build.json
          node --test tests/audit-unit.mjs > audit-evidence/unit-tests.txt
          python scripts/audit-integrity.py
          git diff --exit-code -- data/ fcc-core.js fcc-store.js fcc-clinical-ui.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/)"
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize website typography and build verified immutable assets'
            git push origin HEAD:fix-typography-2026-09-18
          fi
          git rev-parse HEAD > audit-evidence/tested-source-commit.txt
      - name: Install browsers
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: General functional regression before or after changes
        run: python tests/audit-browser.py
      - name: Typography in all local areas and details
        if: ${{ !cancelled() }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          if [ -f scripts/normalize-typography.py ]; then export FCC_TYPO_STAGE=candidate; else export FCC_TYPO_STAGE=baseline; fi
          python tests/audit-typography.py
      - name: Preserve readable source and evidence
        if: always()
        run: git archive --format=zip HEAD -o audit-evidence/tested-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: typography-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
