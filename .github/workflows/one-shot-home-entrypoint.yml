name: One-shot Home entrypoint cache bust

on:
  push:
    branches: [home-news-dual-blocks]
    paths:
      - '.github/workflows/one-shot-home-entrypoint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust navigation entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="navigation-hub.js?v=1.3.0"></script>'
          new='<script src="navigation-hub.js?v=1.3.0-home-news2"></script>'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one navigation entrypoint, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit entrypoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Cache-bust Home news entrypoint'
          git push
