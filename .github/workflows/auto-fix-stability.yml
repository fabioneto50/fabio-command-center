name: One-shot ECG syntax repair
on:
  push:
    branches: [stabilize-1.3.0]
    paths:
      - '.github/workflows/auto-fix-stability.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact ECG syntax defect
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ecg-image-analyzer-v3.js')
          s=p.read_text(encoding='utf-8')
          old="ou ajustar o recorte.`);return}"
          new="ou ajustar o recorte.');return}"
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'Expected exactly one ECG defect, found {count}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check ecg-image-analyzer-v3.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ecg-image-analyzer-v3.js
          git commit -m 'Fix ECG analyzer v3 syntax error'
          git push
