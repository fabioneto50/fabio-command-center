name: Audit hardening quality gate
on:
  push:
    branches: [audit-hardening-2026-09-16]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: Preserve canonical clinical data
        run: |
          if grep -q "APP_VERSION='MASTER 1.3.2'" app.js; then python scripts/export-canonical.py; fi
      - name: Static and unit regression tests
        run: |
          if [ -f tests/audit-unit.mjs ]; then node --test tests/audit-unit.mjs; fi
          if [ -f scripts/audit-integrity.py ]; then python scripts/audit-integrity.py; fi
      - name: Browser audit
        run: python tests/audit-browser.py
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
