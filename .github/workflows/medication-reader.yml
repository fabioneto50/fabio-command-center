name: Dedicated medication reader review
on:
  push:
    branches: [medication-reader-2026-09-18]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medication-reader-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Build exact candidate and preserve clinical data
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "medication-reader-2026-09-18"
          mkdir -p audit-evidence
          if [ -f scripts/apply-medication-reader.py ]; then python scripts/apply-medication-reader.py; fi
          node --expose-internals scripts/build-assets.cjs | tee audit-evidence/build.json
          node --test tests/audit-unit.mjs | tee audit-evidence/unit-tests.txt
          python scripts/audit-integrity.py
          git diff --exit-code e13278b199d54f73b7b76854c9e1a1ff2df0c333 -- data/ fcc-core.js fcc-store.js fcc-clinical-ui.js > audit-evidence/protected-data-and-calculations-unchanged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/)"
          if ! git diff --cached --quiet; then
            git commit -m 'Build dedicated medication reading view'
            git push origin HEAD:medication-reader-2026-09-18
          fi
          git rev-parse HEAD > audit-evidence/tested-source-commit.txt
      - name: Install real browser engines
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: General application regression
        run: python tests/audit-browser.py
      - name: Record layout and return navigation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f tests/audit-record-view.py ]; then python tests/audit-record-view.py; else python tests/audit-compact.py; fi
      - name: Preserve tested source
        if: always()
        run: git archive --format=zip HEAD -o audit-evidence/tested-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: medication-reader-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
