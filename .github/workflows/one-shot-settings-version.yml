name: One-shot Settings version fix

on:
  push:
    branches: [fix-settings-version-1.3.1]
    paths:
      - '.github/workflows/one-shot-settings-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify MASTER 1.3.1 version state
        run: |
          python - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {n}: {old[:80]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          # Runtime/version sources
          exact('app.js', "const APP_VERSION='MASTER 1.3.0';", "const APP_VERSION='MASTER 1.3.1';")
          exact('navigation-hub.js', "const V='1.3.0',ASSET='1.3.0-home-news2';", "const V='1.3.1',ASSET='1.3.1-settings-version';")
          exact('service-worker.js', "const CACHE='fcc-master-1.3.0';", "const CACHE='fcc-master-1.3.1';")
          exact('build-info.json', '"appVersion": "MASTER 1.3.0"', '"appVersion": "MASTER 1.3.1"')
          exact('build-info.json', '"service_worker": "SINGLE REGISTRATION PATH; CACHE fcc-master-1.3.0"', '"service_worker": "SINGLE REGISTRATION PATH; CACHE fcc-master-1.3.1"')

          # Static HTML must never start on obsolete 1.0.0
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if s.count('MASTER 1.0.0') != 3:
              raise SystemExit(f'index.html: expected 3 stale MASTER 1.0.0 labels, found {s.count("MASTER 1.0.0")}')
          s=s.replace('MASTER 1.0.0','MASTER 1.3.1')
          old='<div class="health"><span>App</span><b>MASTER 1.3.1</b></div>'
          new='<div class="health"><span>App</span><b id="appHealthVersion">MASTER 1.3.1</b></div>'
          if s.count(old)!=1: raise SystemExit('index.html: App health row not found exactly once')
          s=s.replace(old,new,1)
          if s.count('<script src="app.js?v=1.3.0"></script>')!=1: raise SystemExit('index app entrypoint mismatch')
          s=s.replace('<script src="app.js?v=1.3.0"></script>','<script src="app.js?v=1.3.1"></script>',1)
          if s.count('<script src="navigation-hub.js?v=1.3.0-home-news2"></script>')!=1: raise SystemExit('index hub entrypoint mismatch')
          s=s.replace('<script src="navigation-hub.js?v=1.3.0-home-news2"></script>','<script src="navigation-hub.js?v=1.3.1-settings-version"></script>',1)
          p.write_text(s,encoding='utf-8')

          # renderMaintenance must write the runtime version directly into System Health.
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old="function renderMaintenance(){\n if(!document.getElementById('sourceRegistry'))return;\n activePackVersion.textContent=contentPack?.version||'—';contentHealth.textContent=contentPack?.version||'—';schemaHealth.textContent='v'+SCHEMA_VERSION;"
          new="function renderMaintenance(){\n if(!document.getElementById('sourceRegistry'))return;\n const runtimeVersion=String(window.FCC_RUNTIME_VERSION||document.documentElement.dataset.fccRuntimeVersion||APP_VERSION).replace(/^MASTER\\s*/i,'').trim();\n const appVersionEl=document.getElementById('appHealthVersion');if(appVersionEl)appVersionEl.textContent='MASTER '+runtimeVersion;\n document.querySelectorAll('.master-chip').forEach(el=>el.textContent='MASTER '+runtimeVersion);\n activePackVersion.textContent=contentPack?.version||'—';contentHealth.textContent=contentPack?.version||'—';schemaHealth.textContent='v'+SCHEMA_VERSION;"
          if s.count(old)!=1: raise SystemExit('renderMaintenance anchor mismatch')
          s=s.replace(old,new,1);p.write_text(s,encoding='utf-8')

          # Version synchronizers: explicit target + current fallback.
          p=Path('version-sync-v1.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("||'1.3.0'","||'1.3.1'")
          old="const page=document.getElementById('page-settings');if(page){ensureCard(page);const badge=document.getElementById('fccRuntimeVersionBadge');if(badge)badge.textContent=label}document.documentElement.dataset.fccVersion=v"
          new="const page=document.getElementById('page-settings');if(page){ensureCard(page);const badge=document.getElementById('fccRuntimeVersionBadge');if(badge)badge.textContent=label;const app=document.getElementById('appHealthVersion');if(app)app.textContent=label}document.documentElement.dataset.fccVersion=v"
          if s.count(old)!=1: raise SystemExit('version-sync explicit target anchor mismatch')
          s=s.replace(old,new,1);p.write_text(s,encoding='utf-8')

          p=Path('version-system-health-v1.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("||'1.3.0'","||'1.3.1'")
          old="if(page){const app=[...page.querySelectorAll('.health')].find(x=>/^App$/i.test(x.querySelector('span')?.textContent.trim()||''));if(app?.querySelector('b'))app.querySelector('b').textContent=label;const badge=document.getElementById('fccRuntimeVersionBadge');if(badge)badge.textContent=label}"
          new="if(page){const explicit=document.getElementById('appHealthVersion');if(explicit)explicit.textContent=label;else{const app=[...page.querySelectorAll('.health')].find(x=>/^App$/i.test(x.querySelector('span')?.textContent.trim()||''));if(app?.querySelector('b'))app.querySelector('b').textContent=label}const badge=document.getElementById('fccRuntimeVersionBadge');if(badge)badge.textContent=label}"
          if s.count(old)!=1: raise SystemExit('version-system-health anchor mismatch')
          s=s.replace(old,new,1)
          s=s.replace("document.addEventListener('fcc-runtime-version-change',sync);", "window.fccSyncSystemVersion=sync;document.addEventListener('fcc-runtime-version-change',sync);",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate version consistency and JavaScript
        run: |
          set -e
          node --check app.js
          node --check navigation-hub.js
          node --check service-worker.js
          node --check version-sync-v1.js
          node --check version-system-health-v1.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          assert json.loads(Path('build-info.json').read_text())['appVersion']=='MASTER 1.3.1'
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'MASTER 1.0.0' not in html
          assert html.count('id="appHealthVersion"')==1
          assert 'app.js?v=1.3.1' in html
          assert 'navigation-hub.js?v=1.3.1-settings-version' in html
          app=Path('app.js').read_text(encoding='utf-8')
          assert "APP_VERSION='MASTER 1.3.1'" in app
          assert "getElementById('appHealthVersion')" in app
          hub=Path('navigation-hub.js').read_text(encoding='utf-8')
          assert "const V='1.3.1'" in hub
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert "fcc-master-1.3.1" in sw
          print('Settings version consistency: PASS')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js navigation-hub.js service-worker.js build-info.json index.html version-sync-v1.js version-system-health-v1.js
          git commit -m 'Fix Settings runtime version sync'
          git push
