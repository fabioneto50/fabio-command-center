name: One-shot Home cleanup
on:
  push:
    branches: [home-current-news-cleanup]
    paths:
      - '.github/workflows/one-shot-home-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace static Home with public-only content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_brand='<p>MASTER · Clinical OS · Emergency · Comms · Garage · Research</p>'
          new_brand='<p>MASTER · Clinical OS · Atualidade</p>'
          if s.count(old_brand)!=1: raise SystemExit('Unexpected brand header count')
          s=s.replace(old_brand,new_brand,1)

          private_nav=[
            ' <button class="nav" data-page="emergency" onclick="go(\'emergency\')"><span class="ni">⚠</span><span>Emergency</span></button>\n',
            ' <button class="nav" data-page="comms" onclick="go(\'comms\')"><span class="ni">⌁</span><span>Comms</span></button>\n',
            ' <button class="nav" data-page="garage" onclick="go(\'garage\')"><span class="ni">◈</span><span>Garage</span></button>\n',
            ' <button class="nav" data-page="research" onclick="go(\'research\')"><span class="ni">⌕</span><span>Research</span></button>\n',
          ]
          for line in private_nav:
            if s.count(line)!=1: raise SystemExit('Unexpected private nav count: '+line[:50])
            s=s.replace(line,'',1)

          home='''<section class="page active" id="page-home">
 <div class="hero"><h2>Clinical Command Center · acesso rápido e atualidade.</h2><p>Consulta clínica estruturada, notícias recentes e estado do sistema num único ecrã.</p><div class="pills"><span class="pill">Clinical OS</span><span class="pill">Notícias atuais</span><span class="pill">PWA / offline-ready</span></div></div>
 <div class="grid">
  <div class="card" id="homeClinicalCard" onclick="go('clinical')" style="cursor:pointer"><span class="eyebrow">CLINICAL OS</span><h3>Consulta clínica</h3><div class="metric">20 <small>módulos</small></div><p>Ventilação, ECG, sépsis, perfusões, fármacos, escalas, casos e workflows.</p><div class="actions"><button class="btn primary" type="button">Abrir Clinical</button></div></div>
  <div class="card full home-news-card" id="homeCurrentNewsCard"><div class="home-news-head"><div><span class="eyebrow">ATUALIDADE</span><h3>Notícias recentes</h3><div class="home-news-meta" id="homeNewsMeta">A preparar notícias…</div></div><button class="btn small" id="homeNewsRefresh" type="button">Atualizar</button></div><div class="home-news-list" id="homeNewsList"><div class="home-news-empty">A carregar notícias…</div></div><div class="tiny" style="margin-top:9px">Fontes da imprensa portuguesa agregadas através do GDELT. Abre sempre a notícia original para leitura e verificação.</div></div>
  <div class="card"><span class="eyebrow">SISTEMA</span><h3>System Health</h3><div class="metric" id="homeHealth">—</div><p>Estado da versão, schema e conteúdos do Command Center.</p><div class="actions"><button class="btn small" onclick="go('settings')">Abrir Maintenance Center</button></div></div>
  <div hidden aria-hidden="true"><span id="homePrep"></span><div id="homeAlerts"></div><textarea id="homeNotes"></textarea></div>
 </div>
</section>

<section class="page" id="page-clinical">'''
          pattern=r'<section class="page active" id="page-home">.*?<section class="page" id="page-clinical">'
          s,n=re.subn(pattern,home,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Home replacement count {n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify Home privacy and boot references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          home=re.search(r'<section class="page active" id="page-home">(.*?)<section class="page" id="page-clinical">',s,re.S).group(1)
          forbidden=['Emergency','LilyGO','BME280','Comms','Garage','Research','Despesas','Pessoal','Alertas','Notas rápidas','Africa Twin','Polaris']
          bad=[x for x in forbidden if x.lower() in home.lower()]
          if bad: raise SystemExit('Private Home content remains: '+', '.join(bad))
          for id_ in ['homeHealth','homePrep','homeAlerts','homeNotes','homeCurrentNewsCard','homeNewsList']:
            if s.count(f'id="{id_}"')!=1: raise SystemExit(f'Expected one #{id_}')
          print('Home public-only check: PASS')
          PY
      - name: Commit Home cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Make Home public-only with current news'
          git push
