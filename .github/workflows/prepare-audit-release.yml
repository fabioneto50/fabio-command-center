name: Prepare and verify audited release
on:
  push:
    branches: [audit-hardening-2026-09-16]
    paths: [scripts/review-r3.json, .github/workflows/prepare-audit-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-audit-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Apply exact post-audit corrections and build
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit-hardening-2026-09-16"
          python scripts/apply-reviewed-source.py
          python scripts/recover-antibiotics.py
          node --expose-internals scripts/build-clinical-data.cjs
          node --expose-internals scripts/build-assets.cjs
          mkdir -p audit-evidence
          node --test tests/audit-unit.mjs | tee audit-evidence/unit-tests.txt
          python scripts/audit-integrity.py
      - name: Freeze exact source and immutable assets on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/)"
          if ! git diff --cached --quiet; then
            git commit -m 'Refine mobile layout and verify genuine connection-loss recovery after browser audit'
            git push origin HEAD:audit-hardening-2026-09-16
          fi
          git rev-parse HEAD > audit-evidence/tested-source-commit.txt
          git rev-parse HEAD^{tree} > audit-evidence/tested-tree.txt
      - name: Install real browser tools
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: Full post-correction browser regression
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python tests/audit-browser.py
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-audit-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
