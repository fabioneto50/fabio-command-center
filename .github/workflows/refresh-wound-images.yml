name: Refresh wound dressing HQ images
on:
  push:
    branches: [main, update/wound-images-hq-v3-20260821]
    paths:
      - 'scripts/refresh_wound_images.py'
      - 'wound-dressings-v1.js'
      - '.github/workflows/refresh-wound-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image extraction dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 pillow pymupdf
      - name: Collect and normalize HQ wound images
        run: python scripts/refresh_wound_images.py
      - name: Publish generated local assets
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/wound-images/hq wound-images-hq-v3.json wound-images-hq-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh wound dressing HQ images [skip ci]'
          git push
