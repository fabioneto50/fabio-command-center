name: Quality gate 1.4
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit-hardening-2026-09-16]
    paths-ignore: ['news-feed.json', 'AUDIT-RESULTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Deterministic build and production-core regressions
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python scripts/recover-antibiotics.py
          node --expose-internals scripts/build-clinical-data.cjs
          node --expose-internals scripts/build-assets.cjs
          node --test tests/audit-unit.mjs | tee audit-evidence/unit-tests.txt
          python scripts/audit-integrity.py
          git diff --exit-code -- index.html asset-manifest.json service-worker.js build-info.json release/ data/
          python scripts/stage-site.py | tee audit-evidence/public-package.json
      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: Full application and multi-version offline regression
        run: |
          set -euo pipefail
          python tests/audit-browser.py
          python tests/audit-upgrade.py
      - name: Website navigation, visual system and reference-library regression
        run: |
          set -euo pipefail
          python tests/audit-design.py
          python tests/audit-library.py
          python tests/audit-polish.py
      - name: Compact reading and individual medication records
        run: |
          set -euo pipefail
          python tests/audit-compact.py
          python tests/audit-compact-interactions.py
          python tests/audit-record-view.py
      - name: Real legacy-to-current migration with synthetic data
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcc-legacy
          git archive fb19f424a5457427f86a1db927d6880286c535a2 | tar -x -C /tmp/fcc-legacy
          FCC_LEGACY_ROOT=/tmp/fcc-legacy python tests/audit-legacy.py
      - name: Upload only verified public runtime files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with: {path: _site}
      - name: Keep evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
  publication-mode:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      actions_enabled: ${{ steps.mode.outputs.actions_enabled }}
    steps:
      - name: Read configuration, never change repository administration
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" = workflow ]; then
            echo 'actions_enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'actions_enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Pages still publishes from a branch. Settings > Pages > Source must be changed to GitHub Actions to enforce verify -> deploy. This job does not alter that setting.'
          fi
  deploy:
    needs: [verify, publication-mode]
    if: github.ref == 'refs/heads/main' && needs.publication-mode.outputs.actions_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exactly the package that passed verification
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  live-audit:
    needs: [verify, deploy]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
          python tests/audit-live.py
          python tests/audit-live-polish.py
          FCC_COMPACT_LIVE=1 python tests/audit-compact-interactions.py
          FCC_RECORD_LIVE=1 python tests/audit-record-view.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
