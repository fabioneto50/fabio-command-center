name: Library and presentation audit
on:
  push:
    branches: [fix-library-polish-2026-09-17]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-polish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Preserve starting source
        run: |
          mkdir -p audit-evidence
          git archive HEAD -o audit-evidence/source-before.zip
          git rev-parse HEAD > audit-evidence/source-before-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-source-${{ github.sha }}
          path: audit-evidence/source-before*
          retention-days: 7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Prepare and verify source on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix-library-polish-2026-09-17"
          if [ -f scripts/apply-library-polish.py ]; then python scripts/apply-library-polish.py; fi
          python scripts/recover-antibiotics.py
          node --expose-internals scripts/build-clinical-data.cjs
          node --expose-internals scripts/build-assets.cjs
          node --test tests/audit-unit.mjs | tee audit-evidence/unit-tests.txt
          python scripts/audit-integrity.py
          python scripts/stage-site.py > audit-evidence/public-package.json
      - name: Freeze application sources and assets only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/)"
          if ! git diff --cached --quiet; then
            git commit -m 'Build requested library and presentation corrections'
            git push origin HEAD:fix-library-polish-2026-09-17
          fi
          git rev-parse HEAD > audit-evidence/tested-source-commit.txt
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: General regression and update checks
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python tests/audit-browser.py
          python tests/audit-upgrade.py
          if [ -f tests/audit-design.py ]; then python tests/audit-design.py; fi
          if [ -f tests/audit-library.py ]; then python tests/audit-library.py; fi
      - name: Targeted presentation and navigation checks
        if: ${{ !cancelled() }}
        run: |
          if [ -f tests/audit-polish.py ]; then GITHUB_SHA="$(git rev-parse HEAD)" python tests/audit-polish.py; fi
      - name: Keep source and evidence
        if: always()
        run: |
          mkdir -p audit-evidence
          git archive HEAD -o audit-evidence/tested-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: library-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
