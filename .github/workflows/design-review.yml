name: Design and navigation review
on:
  push:
    branches: [design-hubs-2026-09-16]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: design-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Prepare candidate without changing production
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python scripts/apply-library.py
          python scripts/apply-design.py
          python scripts/recover-antibiotics.py
          node --expose-internals scripts/build-clinical-data.cjs
          node --expose-internals scripts/build-assets.cjs
          node --test tests/audit-unit.mjs | tee audit-evidence/unit-tests.txt
          python scripts/audit-integrity.py
      - name: Freeze generated assets on design branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "design-hubs-2026-09-16"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/)"
          if ! git diff --cached --quiet; then
            git commit -m 'Build reference-library website design and explicit landing pages'
            git push origin HEAD:design-hubs-2026-09-16
          fi
          git rev-parse HEAD > audit-evidence/tested-source-commit.txt
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
          python -m playwright install --with-deps chromium webkit
      - name: Current published site baseline (read only)
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcc-before-reference
          git archive f38ed391993dd3535a62a240b2b967ed750e749f | tar -x -C /tmp/fcc-before-reference
          (cd /tmp/fcc-before-reference && python tests/audit-live.py)
          cp /tmp/fcc-before-reference/audit-evidence/live-audit.json audit-evidence/before-live-audit.json
      - name: General application and update audit
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python tests/audit-browser.py
          python tests/audit-upgrade.py
      - name: Navigation and visual audit
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python tests/audit-design.py
          python tests/audit-library.py
      - name: Preserve readable source and evidence
        if: always()
        run: |
          mkdir -p audit-evidence
          git archive --format=zip HEAD -o audit-evidence/tested-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: design-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 30
