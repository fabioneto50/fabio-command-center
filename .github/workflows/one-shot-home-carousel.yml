  function ensureShell(){window.fccBuildPublicHome?.();return !!(document.getElementById('homeHealthNewsList')&&document.getElementById('homeWorldNewsList'))}
  function normalize(rows){const seen=new Set();return (Array.isArray(rows)?rows:[]).filter(x=>{const url=safe(x?.articleUrl||x?.url),title=String(x?.title||'').trim();if(!url||!title)return false;const key=title.toLowerCase()+'|'+url;if(seen.has(key))return false;seen.add(key);return true}).slice(0,MAX_ARTICLES)}
  function pairs(items){const out=[];for(let i=0;i<items.length;i+=2)out.push(items.slice(i,i+2));return out}
  function card(kind,x){
    const url=safe(x.articleUrl||x.url),img=safe(x.image),desc=String(x.description||'').trim()||`Leia os detalhes desta notícia publicada por ${x.source||'a fonte original'}.`;
    const visual=img?`<img src="${esc(img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<div class=&quot;home-news-media-fallback&quot; style=&quot;background:${fallbackVisual(kind)}&quot;>${kind==='health'?'+' :'◉'}</div>'">`:`<div class="home-news-media-fallback" style="background:${fallbackVisual(kind)}">${kind==='health'?'+':'◉'}</div>`;
    return `<a class="home-news-item" href="${esc(url)}" target="_blank" rel="noopener"><div class="home-news-media">${visual}</div><div class="home-news-body"><div class="home-news-kicker">${esc(x.source||'Fonte')}${x.publishedAt?' · '+esc(formatDate(x.publishedAt)):''}</div><strong>${esc(x.title)}</strong><div class="home-news-desc">${esc(desc)}</div><div class="home-news-foot"><span class="home-news-source">${esc(x.source||'Fonte')}</span><span class="home-news-read">Ler notícia →</span></div></div></a>`
  }
  function installCarousel(kind,list,items){
    const slides=pairs(items);if(!slides.length){list.innerHTML='<div class="home-news-empty">Sem notícias disponíveis neste momento.</div>';return}
    list.innerHTML=`<div class="home-news-viewport"><div class="home-news-track">${slides.map(pair=>`<div class="home-news-slide">${pair.map(x=>card(kind,x)).join('')}</div>`).join('')}</div></div><div class="home-news-dots">${slides.map((_,i)=>`<button type="button" class="home-news-dot${i===0?' active':''}" aria-label="Página ${i+1}"></button>`).join('')}</div>`;
    const viewport=list.querySelector('.home-news-viewport'),track=list.querySelector('.home-news-track'),dots=[...list.querySelectorAll('.home-news-dot')];
    let index=0,startX=0,deltaX=0,dragging=false;
    const go=n=>{index=Math.max(0,Math.min(slides.length-1,n));track.style.transform=`translate3d(${-index*100}%,0,0)`;dots.forEach((d,i)=>d.classList.toggle('active',i===index));const cardEl=list.closest('.home-news-card');cardEl?.querySelector('[data-news-prev]')?.toggleAttribute('disabled',index===0);cardEl?.querySelector('[data-news-next]')?.toggleAttribute('disabled',index===slides.length-1)};
    dots.forEach((d,i)=>d.addEventListener('click',()=>go(i)));
    const cardEl=list.closest('.home-news-card');cardEl?.querySelector('[data-news-prev]')?.addEventListener('click',()=>go(index-1));cardEl?.querySelector('[data-news-next]')?.addEventListener('click',()=>go(index+1));
    viewport.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;deltaX=0;dragging=true},{passive:true});
    viewport.addEventListener('touchmove',e=>{if(dragging)deltaX=e.touches[0].clientX-startX},{passive:true});
    viewport.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;if(Math.abs(deltaX)>45)go(index+(deltaX<0?1:-1))},{passive:true});
    go(0);
  }
  function renderList(kind,rows,updatedAt,mode='feed'){
    const list=document.getElementById(kind==='health'?'homeHealthNewsList':'homeWorldNewsList'),meta=document.getElementById(kind==='health'?'homeHealthNewsMeta':'homeWorldNewsMeta');if(!list)return;
    installCarousel(kind,list,normalize(rows));
    if(meta){const stamp=formatDate(updatedAt)||formatDate(new Date());meta.textContent=mode==='fallback'?`Reserva local · ${stamp}`:`Atualizado · ${stamp}`}
  }
  function renderFeed(feed,mode='feed'){renderList('health',feed?.health,feed?.updatedAt,mode);renderList('world',feed?.world,feed?.updatedAt,mode)}
  function cached(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(e){return null}}
  function save(feed){try{localStorage.setItem(CACHE_KEY,JSON.stringify(feed))}catch(e){}}
  async function fetchFeed(){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),7000);try{const r=await fetch(`${FEED}?t=${Date.now()}`,{cache:'no-store',signal:ctrl.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(normalize(data?.health).length<2||normalize(data?.world).length<2)throw new Error('feed incompleto');return data}finally{clearTimeout(timer)}}
  async function load(force=false){if(loading||!ensureShell())return;loading=true;const buttons=['homeHealthNewsRefresh','homeWorldNewsRefresh'].map(id=>document.getElementById(id)).filter(Boolean);buttons.forEach(b=>b.disabled=true);try{const c=cached();if(c&&!force)renderFeed(c,'feed');else if(!c)renderFeed(FALLBACK,'fallback');const feed=await fetchFeed();save(feed);renderFeed(feed,'feed')}catch(e){const c=cached();renderFeed(c||FALLBACK,c?'feed':'fallback');window.FCCDiagnostics?.log('home-news-error',e?.message||String(e))}finally{loading=false;buttons.forEach(b=>b.disabled=false)}}
  function bindButtons(){['homeHealthNewsRefresh','homeWorldNewsRefresh'].forEach(id=>{const b=document.getElementById(id);if(b&&!b.dataset.bound){b.dataset.bound='1';b.addEventListener('click',()=>load(true))}})}
  function install(){if(!ensureShell()){setTimeout(install,120);return}addStyles();bindButtons();renderFeed(cached()||FALLBACK,cached()?'feed':'fallback');if(homeActive())load(false);document.addEventListener('fcc-page-change',e=>{if(e.detail?.page==='home'){bindButtons();load(false)}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&homeActive())load(false)})}
  install();
})();
'''
