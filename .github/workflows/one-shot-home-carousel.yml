      {title:'OMS acompanha a resposta internacional a surtos e emergências de saúde',url:'https://www.who.int/emergencies',source:'OMS',publishedAt:'2026-08-20T00:00:00Z',description:'Atualizações de saúde pública, surtos e resposta internacional da Organização Mundial da Saúde.',image:''},
      {title:'Atualidade clínica e de saúde em Portugal',url:'https://www.sns.gov.pt/',source:'SNS',publishedAt:'2026-08-20T00:00:00Z',description:'Informação e atualizações do Serviço Nacional de Saúde em Portugal.',image:''},
      {title:'Notícias e informação de saúde pública',url:'https://www.dgs.pt/',source:'DGS',publishedAt:'2026-08-20T00:00:00Z',description:'Informação recente da Direção-Geral da Saúde.',image:''},
      {title:'Emergência médica em Portugal',url:'https://www.inem.pt/',source:'INEM',publishedAt:'2026-08-20T00:00:00Z',description:'Informação institucional e atualizações de emergência médica.',image:''}
