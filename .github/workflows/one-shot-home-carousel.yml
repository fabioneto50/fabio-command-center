      {title:'Atualidade internacional',url:'https://www.reuters.com/world/',source:'Reuters',publishedAt:'2026-08-20T00:00:00Z',description:'Principais desenvolvimentos internacionais e geopolíticos.',image:''},
      {title:'Notícias do mundo',url:'https://apnews.com/world-news',source:'AP',publishedAt:'2026-08-20T00:00:00Z',description:'Cobertura internacional dos principais acontecimentos mundiais.',image:''},
      {title:'Atualidade europeia',url:'https://www.euronews.com/',source:'Euronews',publishedAt:'2026-08-20T00:00:00Z',description:'Notícias europeias e internacionais em atualização.',image:''},
      {title:'Notícias internacionais',url:'https://www.bbc.com/news/world',source:'BBC',publishedAt:'2026-08-20T00:00:00Z',description:'Cobertura internacional e contexto sobre os principais acontecimentos.',image:''}
    ]
  };

  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const safe=u=>{try{const x=new URL(String(u||''),location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
  const homeActive=()=>document.getElementById('page-home')?.classList.contains('active');
  const formatDate=v=>{const d=new Date(v||'');return isNaN(d)?'':d.toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})};
  const fallbackVisual=kind=>kind==='health'?'linear-gradient(135deg,rgba(22,133,173,.92),rgba(30,93,122,.78))':'linear-gradient(135deg,rgba(101,86,199,.9),rgba(46,72,120,.82))';

  function addStyles(){
    if(document.getElementById('fcc-home-news-style'))return;
    const s=document.createElement('style');s.id='fcc-home-news-style';s.textContent=`
      #page-home .grid{grid-template-columns:1fr;gap:18px}
      #page-home .hero{padding-bottom:24px}
      .home-news-card{grid-column:1/-1;overflow:hidden;padding:18px}
      .home-news-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
      .home-news-head h3{font-size:21px!important;margin:2px 0 0}
      .home-news-meta{color:var(--muted);font-size:12px;margin-top:4px}
      .home-news-controls{display:flex;align-items:center;gap:7px}
      .home-news-arrow{width:38px;height:38px;padding:0!important;border-radius:999px!important;font-size:19px!important;display:grid;place-items:center}
      .home-news-viewport{overflow:hidden;border-radius:15px;touch-action:pan-y pinch-zoom}
      .home-news-track{display:flex;transition:transform .32s cubic-bezier(.2,.75,.25,1);will-change:transform}
      .home-news-slide{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:1px}
      .home-news-item{min-width:0;display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--line);border-radius:16px;background:var(--panel-2);overflow:hidden;transition:border-color .15s ease,transform .15s ease;min-height:360px}
      .home-news-item:hover{border-color:var(--line-strong);transform:translateY(-2px)}
      .home-news-media{height:190px;background:var(--panel-3);position:relative;overflow:hidden}
      .home-news-media img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .3s ease}
      .home-news-item:hover .home-news-media img{transform:scale(1.025)}
      .home-news-media-fallback{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.86);font-size:42px;font-weight:800;letter-spacing:-.05em}
      .home-news-body{display:flex;flex-direction:column;flex:1;padding:15px 16px 16px}
      .home-news-kicker{font-size:11px!important;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin-bottom:7px}
      .home-news-item strong{display:block;font-size:17px!important;line-height:1.3;color:var(--text);letter-spacing:-.015em}
      .home-news-desc{font-size:13px!important;line-height:1.5;color:var(--muted);margin:9px 0 14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
      .home-news-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}
