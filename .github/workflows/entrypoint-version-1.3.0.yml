name: One-shot entrypoint version 1.3.0
on:
  push:
    branches: [stabilize-1.3.0]
    paths:
      - '.github/workflows/entrypoint-version-1.3.0.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version boot scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('<script src="app.js"></script>','<script src="app.js?v=1.3.0"></script>'),
            ('<script src="navigation-hub.js"></script>','<script src="navigation-hub.js?v=1.3.0"></script>')
          ]
          for old,new in pairs:
              n=s.count(old)
              if n!=1: raise SystemExit(f'Expected one {old}, got {n}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit entrypoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Version MASTER 1.3.0 boot scripts'
          git push
