name: Stability check
on:
  push:
    branches: [stabilize-1.3.0]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          failed=0
          for f in *.js; do
            node --check "$f" || failed=1
          done
          exit $failed
      - name: Runtime references
        run: |
          python - <<'PY'
          import re, pathlib, sys
          hub=pathlib.Path('navigation-hub.js').read_text()
          names=re.findall(r"'([^']+\.js)'",hub)
          missing=[x for x in names if not pathlib.Path(x).exists()]
          if missing:
              print('Missing modules:', missing)
              sys.exit(1)
          print('Referenced modules:',len(names),'unique:',len(set(names)))
          dup=[x for x in sorted(set(names)) if names.count(x)>1]
          if dup:
              print('Duplicate module references:',dup)
              sys.exit(1)
          PY
      - name: HTML id duplicates
        run: |
          python - <<'PY'
          import re, pathlib, collections, sys
          s=pathlib.Path('index.html').read_text()
          ids=re.findall(r'\bid=["\']([^"\']+)',s)
          dup=[k for k,v in collections.Counter(ids).items() if v>1]
          print('Static IDs:',len(ids),'duplicates:',dup)
          if dup: sys.exit(1)
          PY
