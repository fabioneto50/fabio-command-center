name: Install complete user wound photos

on:
  push:
    branches: [main]
    paths:
      - 'wound-photo-pack.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and extract 46 wound photos
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, shutil, zipfile
          expected={
            'Acticoat® / Acticoat® Flex 3':1,'Actisorb® Silver 220':1,'Adaptic®':1,'Allevyn® Life':1,
            'Aquacel® Ag+ Extra':2,'Aquacel® Extra':2,'Argenpal 42,5 mg barra cutânea®':1,'Atrauman® Ag':4,
            'Cutanplast®':2,'Emla® Penso':1,'Inadine®':4,'Jelonet®':2,'Melgisorb® Plus':2,'Mepilex®':2,
            'Mepilex® Border Flex':2,'Mepilex® Border Heel':2,'Mepitel®':1,'Merogel®':1,'Multidex®':1,'Nu-Gel®':1,
            'Promogran®':1,'Spongostan® Standard':1,'Surgicel®':3,'Surgicel® Fibrilar':3,'TachoSil®':1,'Tutopatch®':1,
            'Varihesive® Extra Fino':1,'Varihesive® Gel Control':1}
          pack=pathlib.Path('wound-photo-pack.zip')
          report={'status':'FAIL','expected_products':28,'expected_images':46}
          try:
            with zipfile.ZipFile(pack) as z:
              names=set(z.namelist())
              manifest=json.loads(z.read('wound-images-curated-v1.json').decode('utf-8'))
              if manifest.get('product_count')!=28 or manifest.get('image_count')!=46 or manifest.get('source_policy')!='user-provided-conversation-only':
                raise ValueError('invalid manifest metadata')
              products=manifest.get('products') or {}
              if set(products)!=set(expected): raise ValueError('manifest product set mismatch')
              files=[]
              for product,count in expected.items():
                imgs=(products.get(product) or {}).get('images') or []
                if len(imgs)!=count: raise ValueError(f'{product}: {len(imgs)} images, expected {count}')
                for item in imgs:
                  src=item.get('src','')
                  prefix='./assets/wound-images/user-final/'
                  if not src.startswith(prefix) or not src.endswith('.avif'): raise ValueError(f'invalid local path: {src}')
                  fn=src[len(prefix):]
                  if fn not in names: raise ValueError(f'missing asset in pack: {fn}')
                  raw=z.read(fn)
                  if b'ftypavif' not in raw[:48]: raise ValueError(f'invalid AVIF: {fn}')
                  files.append((fn,raw))
              if len(files)!=46 or len({f for f,_ in files})!=46: raise ValueError('asset count is not exactly 46 unique files')
              out=pathlib.Path('assets/wound-images/user-final')
              if out.exists(): shutil.rmtree(out)
              out.mkdir(parents=True,exist_ok=True)
              for fn,raw in files: (out/fn).write_bytes(raw)
              pathlib.Path('wound-images-curated-v1.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              report.update(status='PASS',products=28,images=46,unique_files=46,source='user-provided-conversation-only')
          except Exception as exc:
            report['error']=str(exc)
          pathlib.Path('wound-photo-validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('wound-user-install-audit.txt').write_text(f"Products: {report.get('products',0)}\nImages: {report.get('images',0)}\nSource: user-provided-conversation-only\nValidation: {report['status']}\n",encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='PASS': raise SystemExit(1)
          PY
      - name: Publish validated local photos
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wound-images/user-final wound-images-curated-v1.json wound-photo-validation.json wound-user-install-audit.txt
          git rm -f --ignore-unmatch wound-photo-pack.zip wound-images-user-complete.json wound-photo-install-trigger.txt wound-images-user-v4.json
          git commit -m 'Install validated user wound photos'
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
