name: Install complete user wound photos

on:
  push:
    branches: [main]
    paths:
      - 'wound-photo-chunks/complete.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate wound photo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wound-missing
          cat wound-photo-chunks/part-* > /tmp/wound-pack.b64
          base64 -d /tmp/wound-pack.b64 > /tmp/wound-pack.zip
          unzip -q /tmp/wound-pack.zip -d /tmp/wound-missing
          python - <<'PY'
          import json, pathlib, shutil, subprocess
          root=pathlib.Path('.')
          out=root/'assets/wound-images/user-final'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True,exist_ok=True)
          expected={
            'Acticoat® / Acticoat® Flex 3':('acticoat-flex-3',1),'Actisorb® Silver 220':('actisorb-silver-220',1),'Adaptic®':('adaptic',1),'Allevyn® Life':('allevyn-life',1),
            'Aquacel® Ag+ Extra':('aquacel-ag-extra',2),'Aquacel® Extra':('aquacel-extra',2),'Argenpal 42,5 mg barra cutânea®':('argenpal',1),'Atrauman® Ag':('atrauman-ag',4),
            'Cutanplast®':('cutanplast',2),'Emla® Penso':('emla-penso',1),'Inadine®':('inadine',4),'Jelonet®':('jelonet',2),'Melgisorb® Plus':('melgisorb-plus',2),'Mepilex®':('mepilex',2),
            'Mepilex® Border Flex':('mepilex-border-flex',2),'Mepilex® Border Heel':('mepilex-border-heel',2),'Mepitel®':('mepitel',1),'Merogel®':('merogel',1),'Multidex®':('multidex',1),'Nu-Gel®':('nu-gel',1),
            'Promogran®':('promogran',1),'Spongostan® Standard':('spongostan-standard',1),'Surgicel®':('surgicel',3),'Surgicel® Fibrilar':('surgicel-fibrilar',3),'TachoSil®':('tachosil',1),'Tutopatch®':('tutopatch',1),
            'Varihesive® Extra Fino':('varihesive-extra-fino',1),'Varihesive® Gel Control':('varihesive-gel-control',1)}
          principal={
            'acticoat-flex-3':'a406db1836b4fb5db8415a7c8d9675a1d28397f8','actisorb-silver-220':'59b07e237c5dd90ee831905262f0f81fc000afee','adaptic':'86504d0ca889a063c4d4b6719b2871a0f5e83521','allevyn-life':'86e38843cd486ec10b98ed53ab71b357b7b95c49',
            'aquacel-ag-extra':'a972c301045399e47572ae497b8c6c855705bad9','aquacel-extra':'b48dd273c0117b97b7bfbad3407904c6c7a07bd3','argenpal':'dc44fbfd7f201fc090f7197108b1e0557feedded','atrauman-ag':'574dbb7591ac5fbefce20d5feefa435d3eb74238',
            'cutanplast':'ecafd25ae531ea503149c34714fdd849c67a956b','emla-penso':'3b2b9c69125b7096e7b06fb3e71d96cdb7913743','inadine':'4baa3d7abaaef231482bc3fe10f4ac2ed72ef561','jelonet':'369b0a4b64516fd07c4c624bcf6b72f84ad48216',
            'melgisorb-plus':'bfabf6c33f391cacaf541ea1d8f2c9c29206e179','mepilex':'ae6ed7eddb9039e47596456d53680125ff93f923','mepilex-border-flex':'323b466ebad86dc9215f492e168f7ae364696071','mepilex-border-heel':'6e690424f1544e0c285cb19788b6e36151869296',
            'merogel':'bb911975cf83068da9f435b18ec652ced286148c','multidex':'42abade5ff17c51a49c36e81b3ec336e97208afa','nu-gel':'7bc6a9a17078f91b580709a9f368ebd0e1783dd9','promogran':'c1b7de633f4f79cebc9d79a10e53055c67b1a8cd',
            'spongostan-standard':'a7c7aa927b8c6f3567eddd5ee4848ab1fa57839b','surgicel':'d4d887bd6fd19be72905baa257c7c685254b9f19','surgicel-fibrilar':'088853caf8b67c42a2211e0a2debf26cb4d1ec10','tachosil':'ea2b553dd6b32aed5a804ea50783915a51a604f2',
            'tutopatch':'1414412287199daa2201165ca47afbd5aecfbea3','varihesive-extra-fino':'7af04de05bcf364daa7838d9128077264f5ee0cf','varihesive-gel-control':'55c3f991023505f9996048f069a7cded402540a3'}
          missing_dir=pathlib.Path('/tmp/wound-missing')
          missing_expected={
            'mepitel-01.avif','aquacel-ag-extra-02.avif','aquacel-extra-02.avif','atrauman-ag-02.avif','atrauman-ag-03.avif','atrauman-ag-04.avif','cutanplast-02.avif','inadine-02.avif','inadine-03.avif','inadine-04.avif','jelonet-02.avif','melgisorb-plus-02.avif','mepilex-02.avif','mepilex-border-flex-02.avif','mepilex-border-heel-02.avif','surgicel-02.avif','surgicel-03.avif','surgicel-fibrilar-02.avif','surgicel-fibrilar-03.avif'}
          found={p.name for p in missing_dir.glob('*.avif')}
          if found!=missing_expected: raise SystemExit(f'missing pack mismatch: {sorted(missing_expected-found)} extras={sorted(found-missing_expected)}')
          for fn in found:
              raw=(missing_dir/fn).read_bytes()
              if b'ftypavif' not in raw[:48]: raise SystemExit(f'invalid AVIF: {fn}')
          for product,(slug,count) in expected.items():
              if slug=='mepitel':
                  shutil.copy2(missing_dir/'mepitel-01.avif',out/'mepitel-01.avif')
              else:
                  sha=principal[slug]
                  raw=subprocess.check_output(['git','cat-file','blob',sha])
                  if not (raw[:4]==b'RIFF' and raw[8:12]==b'WEBP'): raise SystemExit(f'invalid principal WEBP {product}: {sha}')
                  (out/f'{slug}-01.webp').write_bytes(raw)
              for i in range(2,count+1):
                  fn=f'{slug}-{i:02d}.avif'
                  shutil.copy2(missing_dir/fn,out/fn)
          manifest={'version':'4.3-user-final','product_count':28,'image_count':46,'source_policy':'user-provided-conversation-only','products':{}}
          total=0
          for product,(slug,count) in expected.items():
              imgs=[]
              for i in range(1,count+1):
                  ext='avif' if (slug=='mepitel' or i>1) else 'webp'
                  fn=f'{slug}-{i:02d}.{ext}'
                  p=out/fn
                  if not p.exists(): raise SystemExit(f'missing output {fn}')
                  imgs.append({'src':f'./assets/wound-images/user-final/{fn}','label':'Imagem principal' if i==1 else f'Imagem complementar {i-1}','kind':'primary' if i==1 else 'supporting','verified':True,'local':True,'source':'user-provided-conversation'})
                  total+=1
              manifest['products'][product]={'images':imgs}
          if total!=46 or len(manifest['products'])!=28: raise SystemExit(f'final count mismatch {len(manifest["products"])}/{total}')
          (root/'wound-images-curated-v1.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          report={'status':'PASS','products':28,'images':46,'principal_original_blobs':27,'new_images':19,'source':'user-provided-conversation-only'}
          (root/'wound-photo-validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'wound-user-install-audit.txt').write_text('Products: 28\nImages: 46\nPrincipal original blobs: 27\nNew images: 19\nSource: user-provided-conversation-only\nValidation: PASS\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Publish validated local photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wound-images/user-final wound-images-curated-v1.json wound-photo-validation.json wound-user-install-audit.txt
          git rm -rf --ignore-unmatch wound-photo-chunks wound-photo-pack.ready wound-images-user-complete.json wound-photo-install-trigger.txt wound-images-user-v4.json
          git commit -m 'Install validated user wound photos'
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
