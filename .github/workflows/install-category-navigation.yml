name: Install category navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-category-navigation.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert navigation module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="app.js"></script>'
          injection = marker + '\n<script src="navigation-hub.js"></script>'
          if 'src="navigation-hub.js"' not in s:
              if marker not in s:
                  raise SystemExit('app.js marker not found in index.html')
              p.write_text(s.replace(marker, injection, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'Navigation module already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load category navigation module'
          git push
