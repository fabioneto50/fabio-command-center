name: Validate curated wound images

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/install_curated_wound_images.py'
      - 'wound-dressings-images-v2.js'
      - '.github/workflows/install-curated-wound-images.yml'
      - '.github/workflows/validate-curated-wound-images.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests pillow numpy
      - name: Build all 27 images without publishing
        run: python scripts/install_curated_wound_images.py
      - name: Validate 27 local outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          m=json.loads(Path('wound-images-curated-v1.json').read_text(encoding='utf-8'))
          assert m.get('product_count')==27
          assert m.get('verified_product_count')==27
          assert len(m.get('products',{}))==27
          for name,data in m['products'].items():
            x=data['images'][0]
            assert x.get('verified') is True and x.get('local') is True
            p=Path(x['src'].replace('./','',1)); assert p.exists(), p
            with Image.open(p) as im:
              assert im.size==(x['width'],x['height'])
          print('PASS: 27/27 curated local images')
          PY
      - name: Validate JavaScript, modules and static IDs
        run: |
          set -e
          for f in ./*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),text=fs.readFileSync('navigation-hub.js','utf8'),refs=[];
          for(const m of text.matchAll(/['"]([^'"]+\.js(?:\?[^'"]*)?)['"]/g)){let p=m[1].replace(/^\.\//,'').split('?')[0];if(!p.includes('/')&&p.endsWith('.js'))refs.push(p)}
          const unique=[...new Set(refs)],dup=[...new Set(refs.filter((x,i)=>refs.indexOf(x)!==i))],missing=unique.filter(p=>!fs.existsSync(p));
          console.log(`Modules ${refs.length}/${unique.length}; missing=${missing.length}; duplicates=${dup.length}`);if(missing.length||dup.length)process.exit(1);
          NODE
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',Path('index.html').read_text(encoding='utf-8'))
          dup=[k for k,v in Counter(ids).items() if v>1]
          print(f'Static IDs={len(ids)} duplicates={len(dup)}')
          if dup: raise SystemExit(1)
          PY
