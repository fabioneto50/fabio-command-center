name: Moto Traffic Android APK

on:
  push:
    branches:
      - 'build/moto-traffic-android'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        working-directory: moto-traffic-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp moto-traffic-android/app/build/outputs/apk/debug/app-debug.apk MotoTraffic-v1.7-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoTraffic-Android-APK
          path: MotoTraffic-v1.7-Android.apk
          if-no-files-found: error
