name: Install user wound images trigger

on:
  push:
    branches: [main]
    paths:
      - 'wound-step2-trigger.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and extract
        run: python scripts/install_user_wound_bundle.py
      - name: Commit user images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wound-images/user-final wound-images-curated-v1.json wound-user-install-audit.txt
          git rm -f wound-images-user-v4.json wound-step2-trigger.txt
          git commit -m 'Step 2: install user-provided wound images only'
          git push
