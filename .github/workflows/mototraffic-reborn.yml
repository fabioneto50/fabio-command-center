name: Build Moto Traffic Reborn

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified source
        run: |
          cat staging/reborn_binary/part* > /tmp/mototraffic.tgz
          echo "a24dbbc7492d10596546767de68c74ef1748a673ebd7782530a357b48bf0d794  /tmp/mototraffic.tgz" | sha256sum -c -
          tar -xzf /tmp/mototraffic.tgz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        working-directory: MotoTraffic
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp MotoTraffic/app/build/outputs/apk/debug/app-debug.apk MotoTraffic-Reborn.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoTraffic-Reborn-APK
          path: MotoTraffic-Reborn.apk
          retention-days: 90
